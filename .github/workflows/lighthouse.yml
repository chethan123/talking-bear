name: Lighthouse

# Plan §4.10 (LCP ≤ 2.0 s and TBT ≤ 150 ms on Lighthouse's mobile preset) and §9 (lighthouse: main only, optional,
# M8); issue #122. Optional and non-blocking: the job continues on error, and lighthouserc.json asserts at `warn`
# level only. LHCI is not a dependency: it runs as a pinned `pnpm dlx`. Its reports go to the runner's filesystem
# and to this run's artifact and summary only, never to temporary-public-storage. Lighthouse's default config is its
# mobile preset (moto g power emulation, simulated 4× CPU and slow 4G throttling); lighthouserc.json names both.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main commit keeps its LCP and TBT: a newer push waits for the running one instead of cancelling it
  # (GitHub keeps one pending run per group).
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The production image, built as ci.yml's image-smoke builds it, from the cache ci.yml writes (read only).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: BUILD_MODE=production
          tags: bear:lighthouse
          cache-from: type=gha,scope=ci
      - name: Run with the production flags
        run: |
          docker run -d --name bear --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65532:65532 --pids-limit 64 --memory 64m -p 8080:8080 bear:lighthouse
      - name: Wait for the probe (30 s limit)
        shell: bash
        run: |
          deadline=$((SECONDS + 30))
          until docker exec bear /bearserve -probe; do
            if [ "$SECONDS" -ge "$deadline" ]; then echo '/bearserve -probe did not succeed within 30 s'; exit 1; fi
            sleep 1
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Lighthouse CI (lighthouserc.json, 3 runs against the image)
        run: pnpm dlx @lhci/cli@0.15.1 autorun
      - name: LCP and TBT per run
        if: always()
        shell: bash
        run: |
          m=lhci-report/manifest.json
          [ -f "$m" ] || { echo "no $m"; exit 0; }
          {
            echo '| LCP (ms) | TBT (ms) | representative |'
            echo '|---|---|---|'
            jq -r '.[] | [.jsonPath, .isRepresentativeRun] | @tsv' "$m" | while IFS=$'\t' read -r p rep; do
              jq -r --arg rep "$rep" '"| \(.audits["largest-contentful-paint"].numericValue|round) | \(.audits["total-blocking-time"].numericValue|round) | \($rep) |"' "$p"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: lhci-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Container log
        if: always()
        run: docker logs bear || true
