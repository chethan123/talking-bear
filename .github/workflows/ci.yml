name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this whole workflow on a v*.*.* tag, with a contents: read token (plan §9, issue #111)
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/gen-bear-parts.ts --check
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm verify
      - run: pnpm parity
      - run: pnpm corpus --subset fast
      - run: pnpm vad-eval --corpus fast --gate tts
      - run: pnpm test:browser
      - run: pnpm build
      - run: pnpm check:dist
      - run: pnpm size-limit

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  # Against the e2e-mode image, not vite preview, so the real server and headers are under test (plan §7 M7, §9;
  # issue #108). bear:e2e serves the specs at BASE_URL; bear:e2e-v1/-v2 sit behind the update proxy (upstream mode)
  # on 4174 for update.spec.ts. Each image's web stage runs check-dist on the e2e dist it embeds.
  e2e:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            BUILD_MODE=e2e
            BEAR_BUILD_ID=main
          tags: bear:e2e
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      # v1 and v2 differ from main only from the web build on (BEAR_BUILD_ID); they read the cache and never write it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            BUILD_MODE=e2e
            BEAR_BUILD_ID=v1
          tags: bear:e2e-v1
          cache-from: type=gha,scope=ci
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            BUILD_MODE=e2e
            BEAR_BUILD_ID=v2
          tags: bear:e2e-v2
          cache-from: type=gha,scope=ci
      - name: Run the images with the production flags
        run: |
          docker run -d --name bear --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65532:65532 --pids-limit 64 --memory 64m -p 8080:8080 bear:e2e
          docker run -d --name bear-v1 --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65532:65532 --pids-limit 64 --memory 64m -p 8081:8080 bear:e2e-v1
          docker run -d --name bear-v2 --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65532:65532 --pids-limit 64 --memory 64m -p 8082:8080 bear:e2e-v2
      - name: Wait for the probes (30 s limit)
        shell: bash
        run: |
          deadline=$((SECONDS + 30))
          for c in bear bear-v1 bear-v2; do
            until docker exec "$c" /bearserve -probe; do
              if [ "$SECONDS" -ge "$deadline" ]; then echo "$c: /bearserve -probe did not succeed within 30 s"; exit 1; fi
              sleep 1
            done
          done
          # Each container serves the build it should (data-build on <html>, vite.config.ts).
          for pair in 8080=main 8081=v1 8082=v2; do
            port=${pair%%=*} id=${pair#*=}
            if ! curl -fsS "localhost:$port/" | grep -q "data-build=\"$id\""; then
              echo "localhost:$port/ does not serve data-build=\"$id\""; exit 1
            fi
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the update proxy in upstream mode on 4174
        shell: bash
        run: |
          node e2e/update-proxy.mjs --port 4174 --upstream v1=http://localhost:8081 --upstream v2=http://localhost:8082 \
            > update-proxy.log 2>&1 &
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors localhost:4174/ | grep -q 'data-build="v1"'
          # The proxy passes the image's headers through unchanged: the same 12 cases as image-smoke, through 4174.
          bash scripts/check-headers.sh http://localhost:4174
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: BASE_URL=http://localhost:8080 pnpm exec playwright test
      # The X-P5 list (plan §5, §7 M7): e2e/csp.spec.ts writes the Trusted Types report-only violations on every run.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xp5-report-only
          path: test-results/xp5-report-only.json
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            update-proxy.log
          retention-days: 7
      - name: Container and proxy logs
        if: always()
        run: |
          for c in bear bear-v1 bear-v2; do echo "::group::docker logs $c"; docker logs "$c" || true; echo '::endgroup::'; done
          cat update-proxy.log || true

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - run: go vet -tags noembed ./... && go test -tags noembed -race ./...
        working-directory: server

  image-build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: bear:local
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: BUILD_MODE=e2e
          tags: bear:e2e
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Run with the production flags (headers, probe, no writes)
        run: |
          docker run -d --name bear --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65532:65532 --pids-limit 64 --memory 64m -p 8080:8080 bear:local
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors -o /dev/null localhost:8080/healthz
          headers=$(curl -sI localhost:8080/)
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -i '^content-security-policy: '
          docker exec bear /bearserve -probe
          changes=$(docker diff bear)
          if [ -n "$changes" ]; then printf 'docker diff bear is not empty:\n%s\n' "$changes"; exit 1; fi
      - name: Image user and size
        shell: bash
        run: |
          user=$(docker image inspect bear:local --format '{{.Config.User}}')
          echo "User: $user"
          test "$user" = 65532:65532
          size=$(docker save bear:local | gzip -9 | wc -c)
          echo "bear:local compressed (docker save | gzip -9): $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container log
        if: always()
        run: docker logs bear || true

  image-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: BUILD_MODE=production
          tags: bear:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Run with the production flags
        run: |
          docker run -d --name bear --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65532:65532 --pids-limit 64 --memory 64m -p 8080:8080 bear:ci
      - name: Wait for the probe (30 s limit)
        shell: bash
        run: |
          deadline=$((SECONDS + 30))
          until docker exec bear /bearserve -probe; do
            if [ "$SECONDS" -ge "$deadline" ]; then echo '/bearserve -probe did not succeed within 30 s'; exit 1; fi
            sleep 1
          done
      - run: bash scripts/check-headers.sh http://localhost:8080
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: BASE_URL=http://localhost:8080 pnpm exec playwright test -c playwright.smoke.config.ts
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-smoke-report
          path: test-results/
          retention-days: 7
      - name: Container log
        if: always()
        run: docker logs bear || true

  compose-headers:
    needs: image-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fresh runner, so bear:ci from image-smoke is not here: rebuild it from the cache image-smoke wrote.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: BUILD_MODE=production
          tags: bear:ci
          cache-from: type=gha,scope=ci
      # X-P4 (plan §5, §4.8.3 Q5): front Caddy → sidecar Caddy → the image; headers exactly once and unchanged.
      - run: docker compose -f deploy/compose/compose.yml up -d && bash scripts/check-compose-headers.sh
      - name: Compose log
        if: always()
        run: docker compose -f deploy/compose/compose.yml logs --no-color || true
