name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/gen-bear-parts.ts --check
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm verify
      - run: pnpm parity
      - run: pnpm corpus --subset fast
      - run: pnpm vad-eval --corpus fast --gate tts
      - run: pnpm test:browser
      - run: pnpm build
      - run: pnpm check:dist
      - run: pnpm size-limit

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  e2e:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm build:e2e
      - run: node scripts/check-dist.mjs dist-e2e e2e
      - run: pnpm exec playwright test
      # The X-P5 list (plan §5, §7 M7): e2e/csp.spec.ts writes the Trusted Types report-only violations on every run.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xp5-report-only
          path: test-results/xp5-report-only.json
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - run: go vet -tags noembed ./... && go test -tags noembed -race ./...
        working-directory: server

  image-build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: bear:local
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: BUILD_MODE=e2e
          tags: bear:e2e
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Run with the production flags (headers, probe, no writes)
        run: |
          docker run -d --name bear --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65532:65532 --pids-limit 64 --memory 64m -p 8080:8080 bear:local
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors -o /dev/null localhost:8080/healthz
          headers=$(curl -sI localhost:8080/)
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -i '^content-security-policy: '
          docker exec bear /bearserve -probe
          changes=$(docker diff bear)
          if [ -n "$changes" ]; then printf 'docker diff bear is not empty:\n%s\n' "$changes"; exit 1; fi
      - name: Image user and size
        shell: bash
        run: |
          user=$(docker image inspect bear:local --format '{{.Config.User}}')
          echo "User: $user"
          test "$user" = 65532:65532
          size=$(docker save bear:local | gzip -9 | wc -c)
          echo "bear:local compressed (docker save | gzip -9): $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container log
        if: always()
        run: docker logs bear || true

  image-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: BUILD_MODE=production
          tags: bear:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Run with the production flags
        run: |
          docker run -d --name bear --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65532:65532 --pids-limit 64 --memory 64m -p 8080:8080 bear:ci
      - name: Wait for the probe (30 s limit)
        shell: bash
        run: |
          deadline=$((SECONDS + 30))
          until docker exec bear /bearserve -probe; do
            if [ "$SECONDS" -ge "$deadline" ]; then echo '/bearserve -probe did not succeed within 30 s'; exit 1; fi
            sleep 1
          done
      - run: bash scripts/check-headers.sh http://localhost:8080
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: BASE_URL=http://localhost:8080 pnpm exec playwright test -c playwright.smoke.config.ts
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-smoke-report
          path: test-results/
          retention-days: 7
      - name: Container log
        if: always()
        run: docker logs bear || true

  compose-headers:
    needs: image-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fresh runner, so bear:ci from image-smoke is not here: rebuild it from the cache image-smoke wrote.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: BUILD_MODE=production
          tags: bear:ci
          cache-from: type=gha,scope=ci
      # X-P4 (plan §5, §4.8.3 Q5): front Caddy → sidecar Caddy → the image; headers exactly once and unchanged.
      - run: docker compose -f deploy/compose/compose.yml up -d && bash scripts/check-compose-headers.sh
      - name: Compose log
        if: always()
        run: docker compose -f deploy/compose/compose.yml logs --no-color || true
