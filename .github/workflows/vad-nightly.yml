name: VAD nightly

# The full TTS regression corpus (plan §7 M2, issue #53): the bit-exact corpus check, the VAD gate on every scene
# and the Silero parity run (the TS port vs onnxruntime-web over the fixtures and the clean TTS speech corpus).
# The fast subset runs on every PR in ci.yml (verify). Parity and the report upload also run when the gate fails.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vad:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm corpus --subset full --check
      - run: pnpm vad-eval --corpus full --gate tts --json report.json
      - if: ${{ !cancelled() }}
        run: pnpm parity
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vad-report
          path: report.json
          retention-days: 30
